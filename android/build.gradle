buildscript {
    // AdMob plugin 8.x and play-services-ads 25.x need Kotlin 2.2+; 2.1.0 fails :capacitor-community-admob:compileReleaseKotlin.
    ext.kotlin_version = '2.2.20'
    ext.kotlin_jvm_target = '21'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // No kotlin-stdlib force: the new ads/mediation SDKs require stdlib 2.3.0+,
    // forcing an older version breaks them at runtime.
}


task clean(type: Delete) {
    delete rootProject.buildDir
}